apiVersion: v1
kind: Service
metadata:
  name: fluxx-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fluxx-gateway
  ports:
    - name: api
      port: 7007
      targetPort: api
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
