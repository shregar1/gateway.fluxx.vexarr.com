name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # AUTH_URL is required at build time (compile fails without it). CI
  # builds in passthrough mode so the test suite never reaches out to
  # a real auth host. Release builds in deploy workflows must set this
  # to the canonical prod URL (e.g. https://auth.vexarr.com).
  AUTH_URL: ""

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Rust edition 2024
      run: rustup default stable && rustup update
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Clippy
      run: cargo clippy -- -D warnings
    - name: Format Check
      run: cargo fmt -- --check
