[workspace]
resolver = "2"
members = [
    "fluxx-core",
    "fluxx-api",
    # fluxx-bin owns the `fluxx` binary. Lives in its own package
    # so it can depend on BOTH fluxx-core and fluxx-api without
    # tripping Cargo's package-level cycle check (fluxx-api already
    # depends back on fluxx-core).
    "fluxx-bin",
]

# Shared profile defaults — keep release builds reasonable and
# debug builds fast enough for `cargo run`.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dev]
opt-level = 0
debug = true

# Redirect the shared vexarr utility crate at `core.utilx.vexarr.com` to a
# local checkout for dev builds. Production builds resolve via the git URL
# in each member crate's `[dependencies]` block.
[patch."https://github.com/shregar1/core.utilx.vexarr.com"]
utilx = { path = "../../utilx/core.utilx.vexarr.com" }
